name: MedCareAxis CI/CD Pipeline

on:
  push:
    branches: [ dev, staging, main ]
  pull_request:
    branches: [ main ]

jobs:
  # ✅ JOB 1 - Test & Build Backend
  test:
    name: Backend build & test
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build -c Release --no-restore

    - name: Run Tests
      run: dotnet test -c Release --no-build

  # ✅ JOB 2 - Build Frontend
  build-frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install root dependencies
      run: cd frontend && npm ci

    - name: Build Hospital frontend
      run: cd frontend/hospital && npm run build

    - name: Upload Hospital dist
      uses: actions/upload-artifact@v4
      with:
        name: hospital-dist
        path: frontend/hospital/dist

  # 🚀 JOB 3 - Deploy to Production (only on main branch)
  deploy-production:
    name: Deploy to Production
    needs: [ test, build-frontend ]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
    - name: Download Hospital dist
      uses: actions/download-artifact@v4
      with:
        name: hospital-dist
        path: hospital-dist

    - name: Copy frontend to server
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        source: "hospital-dist/*"
        target: "/tmp/hospital-dist"
        strip_components: 1

    - name: Deploy to Production
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          set -euo pipefail

          # Pull latest code
          cd /var/www/medcareaxis
          git fetch origin
          git checkout main
          git pull origin main

          # Backup current build
          sudo rm -rf /var/www/medcareaxis-published.bak
          if [ -d /var/www/medcareaxis-published ]; then
            sudo cp -r /var/www/medcareaxis-published /var/www/medcareaxis-published.bak
          fi

          # Build & deploy backend
          /usr/share/dotnet/dotnet publish MedCareAxis.API/MedCareAxis.API.csproj -c Release -o /var/www/medcareaxis-published
          sudo systemctl restart medcareaxis

          # Health check — port 5000
          HEALTHY=0
          for i in $(seq 1 15); do
            if curl -sf http://127.0.0.1:5000/health > /dev/null; then
              HEALTHY=1
              break
            fi
            sleep 3
          done

          if [ "$HEALTHY" -ne 1 ]; then
            echo "❌ Health check failed — rolling back"
            if [ -d /var/www/medcareaxis-published.bak ]; then
              sudo rm -rf /var/www/medcareaxis-published
              sudo mv /var/www/medcareaxis-published.bak /var/www/medcareaxis-published
              sudo systemctl restart medcareaxis
            fi
            exit 1
          fi

          # Deploy frontend
          sudo rm -rf /var/www/hospital/*
          sudo cp -r /tmp/hospital-dist/* /var/www/hospital/
          sudo rm -rf /tmp/hospital-dist

          echo "✅ Production Deployed Successfully!"

  # 🚀 JOB 4 - Deploy to Dev (only on dev branch)
  deploy-dev:
    name: Deploy to Dev
    needs: [ test, build-frontend ]
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
    - name: Deploy to Dev Server
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          set -euo pipefail

          cd /var/www/medcareaxis
          git fetch origin
          git checkout dev
          git pull origin dev

          /usr/share/dotnet/dotnet publish MedCareAxis.API/MedCareAxis.API.csproj -c Release -o /var/www/medcareaxis-dev
          sudo systemctl restart medcareaxis-dev || true

          echo "✅ Dev Deployed Successfully!"

  # 🧪 JOB 5 - Deploy to Staging (only on staging branch)
  deploy-staging:
    name: Deploy to Staging
    needs: [ test, build-frontend ]
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    steps:
    - name: Deploy to Staging Server
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          set -euo pipefail

          cd /var/www/medcareaxis
          git fetch origin
          git checkout staging
          git pull origin staging

          /usr/share/dotnet/dotnet publish MedCareAxis.API/MedCareAxis.API.csproj -c Release -o /var/www/medcareaxis-staging
          sudo systemctl restart medcareaxis-staging || true

          echo "✅ Staging Deployed Successfully!"
