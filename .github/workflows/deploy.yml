name: MedCareAxis CI/CD Pipeline

on:
  push:
    branches: [ dev, staging, main ]
  pull_request:
    branches: [ main ]

jobs:
  # ✅ JOB 1 - Test & Build Backend
  test:
    name: Backend build & test
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build -c Release --no-restore

    - name: Run Tests
      run: dotnet test -c Release --no-build

  # 🌐 JOB 2 - Deploy to Production (only on main branch)
  deploy-production:
    name: Deploy to Production
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
    - name: Deploy to Production
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        port: 22
        timeout: 60s
        command_timeout: 30m
        script: |
          set -euo pipefail

          # Pull latest code
          cd /var/www/medcareaxis
          git fetch origin
          git checkout main
          git pull origin main

          # Backup current backend build
          sudo rm -rf /var/www/medcareaxis-published.bak
          if [ -d /var/www/medcareaxis-published ]; then
            sudo cp -r /var/www/medcareaxis-published /var/www/medcareaxis-published.bak
          fi

          # Build backend
          /usr/share/dotnet/dotnet publish MedCareAxis.API/MedCareAxis.API.csproj -c Release -o /var/www/medcareaxis-published

          # Restart backend service
          sudo systemctl restart medcareaxis

          # Health check — wait up to 45 seconds. Port 5200 to match
          # nginx's proxy_pass, the Dockerfile EXPOSE, and the systemd
          # unit template — keep these in sync if the port ever changes.
          HEALTHY=0
          for i in $(seq 1 15); do
            if curl -sf http://127.0.0.1:5200/health > /dev/null; then
              HEALTHY=1
              break
            fi
            sleep 3
          done

          if [ "$HEALTHY" -ne 1 ]; then
            echo "❌ Health check failed — rolling back backend"
            if [ -d /var/www/medcareaxis-published.bak ]; then
              sudo rm -rf /var/www/medcareaxis-published
              sudo mv /var/www/medcareaxis-published.bak /var/www/medcareaxis-published
              sudo systemctl restart medcareaxis
            fi
            exit 1
          fi

          echo "✅ Backend healthy!"

          # Build and deploy both frontends — only reached once the
          # backend is confirmed healthy. set -e means a failed build
          # stops before the destructive rm -rf, leaving the previously
          # deployed frontend intact.
          cd /var/www/medcareaxis/frontend
          npm ci
          cd hospital
          npm run build
          sudo rm -rf /var/www/hospital/*
          sudo cp -r dist/* /var/www/hospital/
          cd ../patient-portal
          npm run build
          sudo rm -rf /var/www/portal/*
          sudo cp -r dist/* /var/www/portal/

          echo "✅ Production Deployed Successfully!"

  # 🚀 JOB 3 - Deploy to Dev (only on dev branch)
  deploy-dev:
    name: Deploy to Dev
    needs: test
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
    - name: Deploy to Dev Server
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        port: 22
        timeout: 60s
        command_timeout: 30m
        script: |
          set -euo pipefail

          cd /var/www/medcareaxis
          git fetch origin
          git checkout dev
          git pull origin dev

          # Backend — back up the current build so a failed health check can revert to it
          sudo rm -rf /var/www/medcareaxis-dev.bak
          if [ -d /var/www/medcareaxis-dev ]; then
            sudo cp -r /var/www/medcareaxis-dev /var/www/medcareaxis-dev.bak
          fi

          /usr/share/dotnet/dotnet publish MedCareAxis.API/MedCareAxis.API.csproj -c Release -o /var/www/medcareaxis-dev
          sudo systemctl restart medcareaxis-dev

          HEALTHY=0
          for i in $(seq 1 15); do
            if curl -sf http://127.0.0.1:5200/health > /dev/null; then
              HEALTHY=1
              break
            fi
            sleep 3
          done

          if [ "$HEALTHY" -ne 1 ]; then
            echo "❌ Dev health check failed — rolling back backend"
            if [ -d /var/www/medcareaxis-dev.bak ]; then
              sudo rm -rf /var/www/medcareaxis-dev
              sudo mv /var/www/medcareaxis-dev.bak /var/www/medcareaxis-dev
              sudo systemctl restart medcareaxis-dev
            fi
            exit 1
          fi

          cd frontend
          npm ci
          cd hospital
          npm run build
          sudo rm -rf /var/www/hospital-dev/*
          sudo cp -r dist/* /var/www/hospital-dev/
          cd ../patient-portal
          npm run build
          sudo rm -rf /var/www/portal-dev/*
          sudo cp -r dist/* /var/www/portal-dev/

          echo "✅ Dev Deployed Successfully!"

  # 🧪 JOB 4 - Deploy to Staging (only on staging branch)
  deploy-staging:
    name: Deploy to Staging
    needs: test
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    steps:
    - name: Deploy to Staging Server
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        port: 22
        timeout: 60s
        command_timeout: 30m
        script: |
          set -euo pipefail

          cd /var/www/medcareaxis
          git fetch origin
          git checkout staging
          git pull origin staging

          # Backend — back up the current build so a failed health check can revert to it
          sudo rm -rf /var/www/medcareaxis-staging.bak
          if [ -d /var/www/medcareaxis-staging ]; then
            sudo cp -r /var/www/medcareaxis-staging /var/www/medcareaxis-staging.bak
          fi

          /usr/share/dotnet/dotnet publish MedCareAxis.API/MedCareAxis.API.csproj -c Release -o /var/www/medcareaxis-staging
          sudo systemctl restart medcareaxis-staging

          HEALTHY=0
          for i in $(seq 1 15); do
            if curl -sf http://127.0.0.1:5200/health > /dev/null; then
              HEALTHY=1
              break
            fi
            sleep 3
          done

          if [ "$HEALTHY" -ne 1 ]; then
            echo "❌ Staging health check failed — rolling back backend"
            if [ -d /var/www/medcareaxis-staging.bak ]; then
              sudo rm -rf /var/www/medcareaxis-staging
              sudo mv /var/www/medcareaxis-staging.bak /var/www/medcareaxis-staging
              sudo systemctl restart medcareaxis-staging
            fi
            exit 1
          fi

          cd frontend
          npm ci
          cd hospital
          npm run build
          sudo rm -rf /var/www/hospital-staging/*
          sudo cp -r dist/* /var/www/hospital-staging/
          cd ../patient-portal
          npm run build
          sudo rm -rf /var/www/portal-staging/*
          sudo cp -r dist/* /var/www/portal-staging/

          echo "✅ Staging Deployed Successfully!"
