name: MedCareAxis CI/CD Pipeline

on:
  push:
    branches: [ dev, staging, main ]
  pull_request:
    branches: [ main ]

jobs:
  # ✅ JOB 1 - Test & Build Backend
  test:
    name: Backend build & test
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build -c Release --no-restore

    - name: Run Tests
      run: dotnet test -c Release --no-build

  # 🌐 JOB 2 - Deploy to Production (only on main branch)
  deploy-production:
    name: Deploy to Production
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
    - name: Deploy to Production
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        port: 22
        timeout: 60s
        command_timeout: 30m
        script: |
          set -euo pipefail

          # Pull latest code — force reset to avoid conflicts
          cd /var/www/medcareaxis
          git fetch origin
          git checkout main
          git reset --hard origin/main

          # Fix permissions
          sudo chown -R ubuntu:ubuntu /var/www/medcareaxis-published || true
          sudo chmod -R 755 /var/www/medcareaxis-published || true

          # Backup current backend build
          sudo rm -rf /var/www/medcareaxis-published.bak
          if [ -d /var/www/medcareaxis-published ]; then
            sudo cp -r /var/www/medcareaxis-published /var/www/medcareaxis-published.bak
          fi

          # Stop service before publishing to release file locks
          sudo systemctl stop medcareaxis

          # Build backend
          /usr/share/dotnet/dotnet publish MedCareAxis.API/MedCareAxis.API.csproj -c Release -o /var/www/medcareaxis-published

          # Restart backend service
          sudo systemctl start medcareaxis

          # Wait for app to start
          echo "Waiting for app to start..."
          sleep 15

          # Health check — wait up to 100 seconds
          HEALTHY=0
          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:5000/health > /dev/null; then
              HEALTHY=1
              break
            fi
            sleep 5
          done

          if [ "$HEALTHY" -ne 1 ]; then
            echo "❌ Health check failed — rolling back backend"
            sudo systemctl stop medcareaxis
            if [ -d /var/www/medcareaxis-published.bak ]; then
              sudo rm -rf /var/www/medcareaxis-published
              sudo mv /var/www/medcareaxis-published.bak /var/www/medcareaxis-published
            fi
            sudo systemctl start medcareaxis
            exit 1
          fi

          echo "✅ Backend healthy!"

          # Build and deploy hospital frontend
          cd /var/www/medcareaxis/frontend
          npm ci
          cd hospital
          npm run build
          sudo rm -rf /var/www/hospital/*
          sudo cp -r dist/* /var/www/hospital/

          echo "✅ Production Deployed Successfully!"

  # 🚀 JOB 3 - Deploy to Dev (only on dev branch)
  deploy-dev:
    name: Deploy to Dev
    needs: test
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
    - name: Deploy to Dev Server
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        port: 22
        timeout: 60s
        command_timeout: 30m
        script: |
          set -euo pipefail

          cd /var/www/medcareaxis
          git fetch origin
          git checkout dev
          git reset --hard origin/dev

          sudo systemctl stop medcareaxis-dev || true
          /usr/share/dotnet/dotnet publish MedCareAxis.API/MedCareAxis.API.csproj -c Release -o /var/www/medcareaxis-dev
          sudo systemctl start medcareaxis-dev || true

          echo "✅ Dev Deployed Successfully!"

  # 🧪 JOB 4 - Deploy to Staging (only on staging branch)
  deploy-staging:
    name: Deploy to Staging
    needs: test
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    steps:
    - name: Deploy to Staging Server
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        port: 22
        timeout: 60s
        command_timeout: 30m
        script: |
          set -euo pipefail

          cd /var/www/medcareaxis
          git fetch origin
          git checkout staging
          git reset --hard origin/staging

          sudo systemctl stop medcareaxis-staging || true
          /usr/share/dotnet/dotnet publish MedCareAxis.API/MedCareAxis.API.csproj -c Release -o /var/www/medcareaxis-staging
          sudo systemctl start medcareaxis-staging || true

          echo "✅ Staging Deployed Successfully!"
