worker_processes auto;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # ── Security headers (applied globally) ────────────────
    add_header X-Frame-Options           SAMEORIGIN always;
    add_header X-Content-Type-Options    nosniff always;
    add_header X-XSS-Protection          "1; mode=block" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # ── Gzip compression ───────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml
               application/xml+rss text/javascript image/svg+xml;

    # ── Rate limiting zones ────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api:10m    rate=60r/m;
    limit_req_zone $binary_remote_addr zone=login:10m  rate=5r/m;

    # ══════════════════════════════════════════════════════
    # HTTP → HTTPS redirect (all domains)
    # ══════════════════════════════════════════════════════
    server {
        listen 80;
        server_name medcareaxis.com www.medcareaxis.com
                    portal.medcareaxis.com
                    medcareaxis.net www.medcareaxis.net;

        # Let's Encrypt ACME challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://medcareaxis.com$request_uri;
        }
    }

    # ══════════════════════════════════════════════════════
    # medcareaxis.net → redirect to .com (permanent)
    # ══════════════════════════════════════════════════════
    server {
        listen 443 ssl http2;
        server_name medcareaxis.net www.medcareaxis.net;

        ssl_certificate     /etc/nginx/certs/live/medcareaxis.com/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/live/medcareaxis.com/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        return 301 https://medcareaxis.com$request_uri;
    }

    # ══════════════════════════════════════════════════════
    # www.medcareaxis.com → redirect to apex
    # ══════════════════════════════════════════════════════
    server {
        listen 443 ssl http2;
        server_name www.medcareaxis.com;

        ssl_certificate     /etc/nginx/certs/live/medcareaxis.com/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/live/medcareaxis.com/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        return 301 https://medcareaxis.com$request_uri;
    }

    # ══════════════════════════════════════════════════════
    # medcareaxis.com — Hospital Staff Dashboard
    # ══════════════════════════════════════════════════════
    server {
        listen 443 ssl http2;
        server_name medcareaxis.com;

        ssl_certificate     /etc/nginx/certs/live/medcareaxis.com/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/live/medcareaxis.com/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

        client_max_body_size 20M;

        # API proxy — auth endpoints get stricter rate limit
        location /api/auth/login {
            limit_req zone=login burst=5 nodelay;
            proxy_pass         http://api:5200;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        location /api/ {
            limit_req zone=api burst=30 nodelay;
            proxy_pass         http://api:5200;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
            proxy_buffering    off;
        }

        # Hospital React SPA
        location / {
            root  /var/www/hospital;
            index index.html;
            try_files $uri $uri/ /index.html;

            # Cache static assets aggressively
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
            }
        }
    }

    # ══════════════════════════════════════════════════════
    # portal.medcareaxis.com — Patient Portal
    # ══════════════════════════════════════════════════════
    server {
        listen 443 ssl http2;
        server_name portal.medcareaxis.com;

        ssl_certificate     /etc/nginx/certs/live/portal.medcareaxis.com/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/live/portal.medcareaxis.com/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        client_max_body_size 10M;

        # API proxy for patient portal
        location /api/auth/patient-login {
            limit_req zone=login burst=5 nodelay;
            proxy_pass         http://api:5200;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        location /api/ {
            limit_req zone=api burst=30 nodelay;
            proxy_pass         http://api:5200;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        # Patient portal React SPA (PWA)
        location / {
            root  /var/www/portal;
            index index.html;
            try_files $uri $uri/ /index.html;

            # Service worker — no cache
            location = /sw.js {
                add_header Cache-Control "no-cache, no-store, must-revalidate";
            }

            location = /manifest.json {
                add_header Cache-Control "public, max-age=3600";
            }

            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
            }
        }
    }
}
