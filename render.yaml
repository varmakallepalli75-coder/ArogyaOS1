databases:
  - name: medcareaxis-db
    plan: starter
    region: singapore
    postgresMajorVersion: "16"

services:
  - type: web
    name: medcareaxis-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: medcareaxis-db
          property: connectionString

      # ── Secrets (fill in via the Render dashboard — never commit real values) ──
      - key: JwtSettings__SecretKey
        sync: false
      - key: JwtSettings__Issuer
        value: MedCareAxis
      - key: JwtSettings__Audience
        value: MedCareAxis_Users
      - key: JwtSettings__ExpiryMinutes
        value: "480"

      - key: SuperAdmin__Email
        sync: false
      - key: SuperAdmin__Password
        sync: false

      - key: HospitalSettings__HospitalName
        value: MedCareAxis
      - key: HospitalSettings__HospitalCode
        value: MCA001

      # AWS SES, used via generic SMTP — no code change needed
      - key: Email__Host
        value: email-smtp.ap-south-1.amazonaws.com
      - key: Email__Port
        value: "587"
      - key: Email__Username
        sync: false
      - key: Email__Password
        sync: false
      - key: Email__From
        value: noreply@medcareaxis.com
      - key: Email__FromName
        value: MedCareAxis

      - key: Sentry__Dsn
        sync: false

      - key: Msg91__AuthKey
        sync: false
      - key: Msg91__TemplateId
        sync: false

      - key: OtpSettings__Pepper
        sync: false

      - key: R2__AccountId
        sync: false
      - key: R2__AccessKeyId
        sync: false
      - key: R2__SecretAccessKey
        sync: false
      - key: R2__BucketName
        value: medcareaxis-documents

      - key: VapidKeys__PublicKey
        sync: false
      - key: VapidKeys__PrivateKey
        sync: false
      - key: VapidKeys__Subject
        value: mailto:admin@medcareaxis.com

      # Comma-separated (not a JSON array) — see Program.cs for why.
      # Fill in with the final Vercel-fronted custom domains once known.
      - key: Cors__AllowedOrigins
        value: https://medcareaxis.com,https://www.medcareaxis.com,https://portal.medcareaxis.com
